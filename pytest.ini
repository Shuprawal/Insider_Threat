# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = Dissertation.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
norecursedirs = .* build dist node_modules static staticfiles threat-detection-frontend
addopts = -rP -vv
markers =
    regression: tests that must never break (stable contracts)
